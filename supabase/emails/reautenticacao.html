<!--
  Supabase → Authentication → Emails → "Reauthentication"
  (usado se a opção "Secure password change" estiver ligada: confirma a troca de senha)
  Assunto sugerido: Confirme a alteração na sua conta Fixum: {{ .Token }}
-->
<!DOCTYPE html>
<html lang="pt-BR">
<body style="margin:0;padding:0;background:#F3EEE4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16201C;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3EEE4;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FAF7F1;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="background:#16201C;padding:22px 28px;color:#FAF7F1;font-size:20px;font-weight:800;letter-spacing:-0.02em;">
              Fixum
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <h1 style="margin:0 0 12px;font-size:20px;line-height:1.3;">Confirme a alteração</h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.55;color:#3F3B34;">
                Recebemos um pedido para alterar dados de segurança da sua conta. Para confirmar, use este código:
              </p>
              <div style="margin:0 0 20px;padding:18px;border-radius:12px;background:#ffffff;border:1.5px solid #E0D8CA;text-align:center;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:32px;font-weight:800;letter-spacing:0.3em;color:#16201C;">
                {{ .Token }}
              </div>
              <p style="margin:0;font-size:13px;line-height:1.55;color:#7A7264;">
                Se não foi você, ignore este e-mail e considere ativar a verificação em duas etapas na sua conta.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
